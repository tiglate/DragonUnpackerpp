name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ zlib1g-dev \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools libqt6svg6 \
            libspdlog-dev libmsgsl-dev python3 lzop ccache libgl1-mesa-dev
      - name: Build the driver and the interface
        run: ./make.sh build all
      - name: Driver tests (C harness, fixtures, fuzzing)
        run: ./make.sh test-driver
      - name: Interface tests (needs no display)
        run: ./make.sh test-ui
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6 for MSVC
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: vcpkg packages (zlib, spdlog, ms-gsl)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT/vcpkg.exe" install zlib:x64-windows spdlog:x64-windows ms-gsl:x64-windows
      - name: Python test dependencies
        run: python -m pip install texture2ddecoder pillow
      - name: Check the prerequisites
        shell: pwsh
        run: ./make.ps1 configure
      - name: Build the driver and the interface (MSVC)
        shell: pwsh
        run: ./make.ps1 build all
      - name: Driver tests (C harness, fixtures, fuzzing)
        shell: pwsh
        run: ./make.ps1 test-driver
      - name: Interface tests (needs no display)
        shell: pwsh
        run: ./make.ps1 test-ui
      - name: MSI installer (WiX v6)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          ./make.ps1 msi
      - uses: actions/upload-artifact@v4
        with:
          name: dragonunpacker-windows-msi
          path: dist/*.msi
